<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Waris Syafi'i v2.6</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans & Amiri (Arab) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-arabic { font-family: 'Amiri', serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between p-3 sm:p-6">

  <!-- CONTAINER UTAMA -->
  <div class="max-w-3xl w-full mx-auto bg-white rounded-3xl border border-slate-200/80 shadow-xl overflow-hidden p-5 sm:p-8">
    
    <!-- HEADER BOX -->
    <div class="text-center border-b border-slate-100 pb-5 mb-6">
      <div class="inline-flex items-center gap-2 bg-emerald-50 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold mb-2 border border-emerald-100">
        <span>🕌</span> Faraidh Mazhab Syafi'i v2.6
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Kalkulator Waris Islam</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">Perhitungan otomatis sesuai Hukum Faraidh Syafi'i, Dalil Syari'i, & Sifat Kasus</p>
      <div class="text-[11px] text-amber-600 font-semibold mt-2">developer: fatur62</div>
    </div>

    <form id="formWaris" onsubmit="return false;">
      
      <!-- SEKSI 1: DATA HARTA & TANGGUNGAN -->
      <div class="mb-6">
        <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-800 border-b border-emerald-100 pb-2 mb-4 flex items-center gap-2">
          <span>1.</span> Data Harta & Tanggungan (Rp)
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Total Harta Kotor</label>
            <input type="text" id="hartaKotor" value="100.000.000" placeholder="0" oninput="formatRupiahInput(this)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Hutang & Biaya Jenazah</label>
            <input type="text" id="hutangBiaya" value="0" placeholder="0" oninput="formatRupiahInput(this)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Wasiat (Maks 1/3 Harta)</label>
            <input type="text" id="wasiat" value="0" placeholder="0" oninput="formatRupiahInput(this)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
      </div>

      <!-- SEKSI 2: AHLI WARIS UTAMA -->
      <div class="mb-6">
        <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-800 border-b border-emerald-100 pb-2 mb-4 flex items-center gap-2">
          <span>2.</span> Ahli Waris Utama (Garis Usul & Furu')
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          
          <label class="flex items-center justify-between p-3 rounded-2xl border border-slate-200 bg-slate-50/50 hover:bg-emerald-50/40 cursor-pointer transition-all">
            <span class="text-xs font-bold text-slate-700">💍 Ada Suami?</span>
            <input type="checkbox" id="suami" onchange="togglePasangan('suami')" class="w-4 h-4 accent-emerald-600">
          </label>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Jumlah Istri (0-4)</label>
            <input type="number" id="istri" min="0" max="4" value="0" onchange="togglePasangan('istri')" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">👦 Jumlah Anak Laki-Laki</label>
            <input type="number" id="anakLaki" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">👧 Jumlah Anak Perempuan</label>
            <input type="number" id="anakPerempuan" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <label class="flex items-center justify-between p-3 rounded-2xl border border-slate-200 bg-slate-50/50 hover:bg-emerald-50/40 cursor-pointer transition-all">
            <span class="text-xs font-bold text-slate-700">👴 Ayah Masih Hidup?</span>
            <input type="checkbox" id="ayah" class="w-4 h-4 accent-emerald-600">
          </label>

          <label class="flex items-center justify-between p-3 rounded-2xl border border-slate-200 bg-slate-50/50 hover:bg-emerald-50/40 cursor-pointer transition-all">
            <span class="text-xs font-bold text-slate-700">👵 Ibu Masih Hidup?</span>
            <input type="checkbox" id="ibu" class="w-4 h-4 accent-emerald-600">
          </label>

        </div>
      </div>

      <!-- SEKSI 3: CUCU & NENEK / KAKEK -->
      <div class="mb-6">
        <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-800 border-b border-emerald-100 pb-2 mb-4 flex items-center gap-2">
          <span>3.</span> Cucu & Kakek / Nenek
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          
          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Cucu Laki (dr Anak Lk)</label>
            <input type="number" id="cucuLaki" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Cucu Perempuan (dr Anak Lk)</label>
            <input type="number" id="cucuPerempuan" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <label class="flex items-center justify-between p-3 rounded-2xl border border-slate-200 bg-slate-50/50 hover:bg-emerald-50/40 cursor-pointer transition-all">
            <span class="text-xs font-bold text-slate-700">🧓 Kakek (Ayah dari Ayah)</span>
            <input type="checkbox" id="kakek" class="w-4 h-4 accent-emerald-600">
          </label>

          <label class="flex items-center justify-between p-3 rounded-2xl border border-slate-200 bg-slate-50/50 hover:bg-emerald-50/40 cursor-pointer transition-all">
            <span class="text-xs font-bold text-slate-700">👵 Nenek (Ibu dari Ibu)</span>
            <input type="checkbox" id="nenekIbu" class="w-4 h-4 accent-emerald-600">
          </label>

          <label class="flex items-center justify-between p-3 rounded-2xl border border-slate-200 bg-slate-50/50 hover:bg-emerald-50/40 cursor-pointer transition-all sm:col-span-2">
            <span class="text-xs font-bold text-slate-700">👵 Nenek (Ibu dari Ayah)</span>
            <input type="checkbox" id="nenekAyah" class="w-4 h-4 accent-emerald-600">
          </label>

        </div>
      </div>

      <!-- SEKSI 4: SAUDARA & PAMAN -->
      <div class="mb-6">
        <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-800 border-b border-emerald-100 pb-2 mb-4 flex items-center gap-2">
          <span>4.</span> Saudara & Kerabat Laki-Laki (Hawasi)
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          
          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Sdr Kandung Laki-laki</label>
            <input type="number" id="saudaraKandungLaki" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Sdr Kandung Perempuan</label>
            <input type="number" id="saudaraKandungPerempuan" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Sdr Seayah Laki-laki</label>
            <input type="number" id="saudaraSeayahLaki" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Sdr Seayah Perempuan</label>
            <input type="number" id="saudaraSeayahPerempuan" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Sdr Seibu (Lk / Pr)</label>
            <input type="number" id="saudaraSeibu" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Paman Kandung (Sdr Ayah)</label>
            <input type="number" id="pamanKandung" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Paman Seayah</label>
            <input type="number" id="pamanSeayah" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700">Sepupu Laki (Anak Paman Kdg)</label>
            <input type="number" id="anakPamanKandung" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

          <div class="p-3 rounded-2xl border border-slate-200 bg-slate-50/50 flex items-center justify-between sm:col-span-2">
            <label class="text-xs font-bold text-slate-700">Sepupu Laki (Anak Paman Seayah)</label>
            <input type="number" id="anakPamanSeayah" min="0" value="0" class="w-16 p-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold text-center">
          </div>

        </div>
      </div>

      <!-- TOMBOL HITUNG -->
      <button type="button" onclick="prosesHitungWaris()" class="w-full py-4 bg-gradient-to-r from-emerald-700 to-teal-700 hover:from-emerald-800 hover:to-teal-800 text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-emerald-700/25 active:scale-98 transition-all">
        ⚡ Hitung Pembagian Waris
      </button>

    </form>

    <!-- HASIL OUTPUT (RENDERED BY SCRIPT.JS) -->
    <div id="hasilOutput" class="mt-8"></div>

    <!-- TOMBOL CETAK -->
    <button id="btnCetakPDF" onclick="window.print()" class="hidden w-full mt-4 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shadow-md transition-all">
      🖨️ Cetak / Simpan PDF Hasil Perhitungan
    </button>

  </div>

  <!-- SCRIPT HELPER PERIFAREL -->
  <script>
    function formatRupiahInput(input) {
      let value = input.value.replace(/[^0-9]/g, '');
      if (value === '') {
        input.value = '';
        return;
      }
      input.value = parseInt(value, 10).toLocaleString('id-ID');
    }

    function togglePasangan(type) {
      if (type === 'suami' && document.getElementById('suami').checked) {
        document.getElementById('istri').value = 0;
      } else if (type === 'istri' && parseInt(document.getElementById('istri').value) > 0) {
        document.getElementById('suami').checked = false;
      }
    }
  </script>

  <!-- KONEKSIKAN KE ENGINE SCRIPT.JS v2.6 -->
  <script src="script.js?v=2.6"></script>
</body>
</html>
